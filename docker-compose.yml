services:

  # ─── PHP-FPM (Laravel) ───────────────────────────────────────────
  api:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: mao_fechada_api
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
    environment:
      - PHP_IDE_CONFIG=serverName=mao_fechada
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mao_fechada

  # ─── Nginx (serve o Laravel e faz proxy do React) ────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: mao_fechada_nginx
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/api
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - mao_fechada

  # ─── MySQL ───────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mao_fechada_db
    ports:
      - "3306:3306"       # expõe para acessar via TablePlus / DBeaver
    environment:
      MYSQL_DATABASE:      mao_fechada
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER:          mao_fechada
      MYSQL_PASSWORD:      secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mao_fechada

  # ─── Redis (cache, sessões, filas) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mao_fechada_redis
    ports:
      - "6379:6379"
    networks:
      - mao_fechada

  # ─── Node (React dev server) ─────────────────────────────────────
  web:
    image: node:20-alpine
    container_name: mao_fechada_web
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules   # evita conflito com node_modules local
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - mao_fechada

volumes:
  db_data:
  web_node_modules:

networks:
  mao_fechada:
    driver: bridge